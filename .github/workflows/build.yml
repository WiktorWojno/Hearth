name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Patch Android (Termux backup + version 0.1)
        run: python3 native/patch-android.py
      - name: App icon
        run: |
          for d in android/app/src/main/res/mipmap-*dpi; do
            n=$(basename "$d")
            cp "resources/android/$n/ic_launcher.png" "$d/ic_launcher.png"
            cp "resources/android/$n/ic_launcher_round.png" "$d/ic_launcher_round.png"
            cp "resources/android/$n/ic_launcher_foreground.png" "$d/ic_launcher_foreground.png"
          done
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
