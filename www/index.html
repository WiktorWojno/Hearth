<script>var VER=4;try{const o=localStorage.getItem('hearth_ota'),m=o&&o.match(/var VER=(\d+)/);if(m&&+m[1]>VER){document.open();document.write(o);document.close()}}catch(e){}</script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
let S={chars:[],books:[],personas:[],chats:{},links:{},persona:null};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('hearth')||'{}'))}catch(e){}
let saveErr=false;
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('hearth',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbGet=async()=>{const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('k').objectStore('k').get('S');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const idbSet=async v=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,'S');t.oncomplete=res;t.onerror=()=>rej(t.error)})};
let idbOK=false,tm;
const save=()=>{S.ts=Date.now();if(!idbOK){try{localStorage.setItem('hearth',JSON.stringify(S));saveErr=false}catch(e){saveErr=true}return}clearTimeout(tm);tm=setTimeout(()=>idbSet(S).then(()=>{saveErr=false}).catch(()=>{saveErr=true}),250)};
let V={stick:true,tab:'home',chat:null,sheet:null,busy:false,edit:null,ctl:null};
const CFG0={repo:'WiktorWojno/Hearth',gh:'',html:true,theme:'auto',prov:'openai',url:'https://api.openai.com/v1',key:'',model:'',temp:0.9,max:600,top:1,sys:'',fs:16,ff:'serif',hist:40};S.cfg=Object.assign({},CFG0,S.cfg);
S.old=S.old||{};
const fix=()=>{S.cfg=Object.assign({},CFG0,S.cfg);S.old=S.old||{}};
const PRE={openai:'https://api.openai.com/v1',openrouter:'https://openrouter.ai/api/v1',anthropic:'https://api.anthropic.com/v1',local:'http://localhost:5001/v1'};
let M=[],hd=0,pop=false;
const BG={dusk:'linear-gradient(160deg,rgba(90,80,220,.2),rgba(220,80,160,.15))',forest:'linear-gradient(160deg,rgba(40,170,110,.2),rgba(40,120,200,.14))',ember:'linear-gradient(160deg,rgba(240,140,60,.22),rgba(220,60,90,.15))'};
const bgOf=c=>c.bg==='avatar'&&c.img?`linear-gradient(color-mix(in srgb,var(--bg) 86%,transparent),color-mix(in srgb,var(--bg) 86%,transparent)),url(${c.img}) center/cover`:BG[c.bg]?BG[c.bg]+',var(--bg)':'';
const toast=m=>{document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),2200)};
const strip=t=>t.replace(/<[^>]*>/g,'').replace(/[*`]/g,'');
const applyTheme=()=>{const t=S.cfg.theme;if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;const st=document.documentElement.style;st.setProperty('--fs',(S.cfg.fs||16)+'px');st.setProperty('--ff',S.cfg.ff==='sans'?'system-ui,sans-serif':'Literata,Georgia,serif')};
function syncHist(){const w=(V.chat?1:0)+(V.sheet?1:0)+(V.tab!=='home'?1:0);if(w>hd){while(hd<w){history.pushState({},'');hd++}}else if(w<hd){pop=true;history.go(w-hd);hd=w}}
async function dl(n,t){try{const f=new File([t],n,{type:'text/plain'});if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(t);toast('Copied to clipboard. Paste it into a note to keep it.')}catch(e){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t]));a.download=n;a.click()}}
async function checkUpdate(manual){const g=S.cfg;if(!g.repo)return manual&&toast('Set an update source first');
 try{const r=await fetch(`https://api.github.com/repos/${g.repo}/contents/www/index.html`,{cache:'no-store',headers:{accept:'application/vnd.github.raw+json',...(g.gh?{authorization:'Bearer '+g.gh}:{})}});
  if(!r.ok)throw Error(r.status===404?'repo not found (private repos need a token)':r.status);
  const t=await r.text(),m=t.match(/var VER=(\d+)/);
  if(m&&+m[1]>VER){localStorage.setItem('hearth_ota',t);toast('Update v'+m[1]+' downloaded. Restarting…');setTimeout(()=>location.reload(),1500)}
  else if(manual)toast('You’re up to date (v'+VER+')')}
 catch(e){if(manual)toast('Update check failed: '+e.message)}}
async function fetchModels(){readCfg();const g=S.cfg,an=g.prov==='anthropic';
 try{const r=await fetch(g.url.replace(/\/$/,'')+'/models',{headers:an?{'x-api-key':g.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}:(g.key?{authorization:'Bearer '+g.key}:{})});
  if(!r.ok)throw Error(r.status);const j=await r.json();M=(j.data||j.models||[]).map(m=>m.id||m.name||m).filter(x=>typeof x==='string').sort();
  V.sheet={t:'prov'};render();toast(M.length+' models found. Tap the Model field to pick one.')}
 catch(e){V.sheet={t:'prov'};render();toast('Could not reach the server: '+e.message)}};
const OK=new Set('img span b i em strong u s del br p div a font center small big sub sup code pre hr blockquote ul ol li h1 h2 h3 h4 h5 h6 table thead tbody tr td th details summary mark q cite abbr'.split(' '));
const AT=new Set('style alt width height color size title align colspan rowspan open'.split(' '));
const DROP=/^(script|style|iframe|object|embed|link|meta|svg|math|form|textarea|select|button|input|video|audio|base|template|noscript)$/;
const BAD=/url\s*\(|expression|@import|javascript:|behavior|position\s*:\s*(fixed|absolute|sticky)|z-index/i;
function clean(n){for(const c of [...n.childNodes]){if(c.nodeType===3)continue;if(c.nodeType!==1){c.remove();continue}
 const t=c.tagName.toLowerCase();
 if(DROP.test(t)){c.remove();continue}
 if(!OK.has(t)){clean(c);c.replaceWith(...c.childNodes);continue}
 for(const a of [...c.attributes]){const k=a.name.toLowerCase(),v=a.value.trim();
  const ok=k==='src'?t==='img'&&/^(https?:|data:image\/(png|jpe?g|gif|webp|avif);)/i.test(v):k==='href'?t==='a'&&/^https?:/i.test(v):k==='style'?!BAD.test(v):AT.has(k);
  if(!ok)c.removeAttribute(a.name)}
 if(t==='a'){c.target='_blank';c.rel='noopener noreferrer nofollow'}
 if(t==='img'){c.loading='lazy';c.referrerPolicy='no-referrer'}
 clean(c)}}
function md(n){for(const c of [...n.childNodes]){if(c.nodeType===3){if(/[*`]/.test(c.data)){const s=document.createElement('span');
  s.innerHTML=esc(c.data).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\n]+)\*/g,'<i>$1</i>');c.replaceWith(...s.childNodes)}}
  else if(c.nodeType===1&&!/^(code|pre)$/i.test(c.tagName))md(c)}}
function rich(t){if(S.cfg.html===false)return esc(t);
 const b=new DOMParser().parseFromString('<body>'+t,'text/html').body;clean(b);md(b);return b.innerHTML}
const readCfg=()=>{const g=S.cfg;for(const[k,id]of Object.entries({prov:'prov',url:'g_url',key:'g_key',model:'g_model',temp:'g_temp',max:'g_max',top:'g_top',sys:'g_sys',html:'g_html',theme:'g_theme',fs:'g_fs',ff:'g_ff',repo:'g_repo',gh:'g_gh',hist:'g_hist'})){const e=document.getElementById(id);if(!e)continue;
 g[k]=e.type==='checkbox'?e.checked:['temp','max','top','fs','hist'].includes(k)?(e.value===''?g[k]:+e.value):k==='sys'?e.value:e.value.trim()}};

/* ---------- import ---------- */
const lat=b=>{let s='';for(const x of b)s+=String.fromCharCode(x);return s};
function pngText(buf){const d=new DataView(buf),u=new Uint8Array(buf),o={};let p=8;
 while(p<buf.byteLength-8){const n=d.getUint32(p),t=lat(u.slice(p+4,p+8));
  if(t==='tEXt'){const b=u.slice(p+8,p+8+n),z=b.indexOf(0);o[lat(b.slice(0,z))]=lat(b.slice(z+1))}
  p+=12+n;if(t==='IEND')break}return o}
const b64json=s=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0))));
function thumb(file){return new Promise(r=>{const i=new Image(),url=URL.createObjectURL(file);
 i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),m=Math.min(i.width,i.height);
  x.drawImage(i,(i.width-m)/2,(i.height-m)/4>0?(i.height-m)/4:0,m,m,0,0,256,256);URL.revokeObjectURL(url);r(c.toDataURL('image/jpeg',.8))};
 i.onerror=()=>r('');i.src=url})}
function normBook(j,name){const raw=j.entries||[],list=Array.isArray(raw)?raw:Object.values(raw);
 return{id:uid(),name:j.name||name||'Lorebook',entries:list.map(e=>({
  name:e.comment||e.name||'',keys:[].concat(e.keys||e.key||[]).filter(Boolean),content:e.content||'',
  constant:!!e.constant,on:e.enabled!==false&&!e.disable})).filter(e=>e.content)}}
function addChar(j,img,fname){const d=j.data||j;if(!d.name)throw Error('No character data found');
 const c={id:uid(),name:d.name,desc:d.description||'',pers:d.personality||'',scen:d.scenario||'',
  first:d.first_mes||'',alts:d.alternate_greetings||[],creator:d.creator||'',ex:d.mes_example||'',sys:d.system_prompt||'',img};
 S.chars.push(c);
 if(d.character_book&&(d.character_book.entries||[]).length){const b=normBook(d.character_book,d.name+' lore');S.books.push(b);S.links[c.id]=[b.id]}

async function importFiles(files){const msg=[];
 for(const f of files){try{
  if(/png$/i.test(f.name)||f.type==='image/png'){const t=pngText(await f.arrayBuffer()),k=t.ccv3||t.chara;
   if(!k)throw Error('no character data in this PNG');msg.push('Added '+addChar(b64json(k),await thumb(f)))}
  else{const j=JSON.parse(await f.text());if(j.chars&&j.books){S=Object.assign(S,j);msg.push('Restored backup');continue}
   if(j.entries||j.character_book===undefined&&j.data?.entries){const b=normBook(j,f.name.replace(/\.json$/i,''));S.books.push(b);msg.push('Added lorebook '+b.name)}
   else msg.push('Added '+addChar(j,''))}
