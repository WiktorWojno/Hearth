<!DOCTYPE html>
<html lang="en" data-motion="full"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hearth</title>
<meta name="description" content="Hearth — a warm place for characters, stories and long conversations.">
<meta name="theme-color" content="#12051f" id="themecolor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&family=Outfit:wght@400;600;700&display=swap">
<style>
/* ── Hearth 0.1 — Sakura Night ─────────────────────────────── */
:root{
  --bg:#12051f;--bg2:#1b0930;--sf:#1d0b31;--sf2:#261041;
  --ink:#fbeaff;--mut:#b99ac9;--ln:#3a1d52;
  --ac:#ff8fd8;--ac2:#c77dff;--acT:#260520;
  --g1:#ef6fc4;--g2:#9b6cff;--me:#ef6fc4;--meT:#fff;--bot:#221035;
  --dg:#ff758c;--ok:#63e6b0;
  --sh:0 18px 50px rgba(0,0,0,.5);--sh2:0 6px 22px rgba(0,0,0,.35);
  --glow:rgba(255,143,216,.22);
  --ease-out:cubic-bezier(.22,1,.36,1);--ease-spring:cubic-bezier(.2,1.08,.3,1);
  --dur-fast:.14s;--dur:.22s;--dur-slow:.34s;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#fdf3fb;--bg2:#f9e8f6;--sf:#fff;--sf2:#fbeaf7;
    --ink:#2b1433;--mut:#7d648c;--ln:#f0d9ec;
    --ac:#c2449e;--ac2:#7d4fd3;--acT:#fff;
    --g1:#c2449e;--g2:#7d4fd3;--me:#c2449e;--meT:#fff;--bot:#fff;
    --dg:#c62828;--ok:#178a5e;
    --sh:0 18px 50px rgba(90,30,80,.14);--sh2:0 6px 22px rgba(90,30,80,.1);
    --glow:rgba(194,68,158,.16);color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#fdf3fb;--bg2:#f9e8f6;--sf:#fff;--sf2:#fbeaf7;
  --ink:#2b1433;--mut:#7d648c;--ln:#f0d9ec;
  --ac:#c2449e;--ac2:#7d4fd3;--acT:#fff;
  --g1:#c2449e;--g2:#7d4fd3;--me:#c2449e;--meT:#fff;--bot:#fff;
  --dg:#c62828;--ok:#178a5e;
  --sh:0 18px 50px rgba(90,30,80,.14);--sh2:0 6px 22px rgba(90,30,80,.1);
  --glow:rgba(194,68,158,.16);color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  overflow:hidden;color:var(--ink);
  font:16px/1.45 Inter,system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(120% 62% at 50% -16%,var(--glow),transparent 62%),
    radial-gradient(90% 44% at 108% 6%,color-mix(in srgb,var(--ac2) 13%,transparent),transparent 60%),
    var(--bg);
}
#app{
  height:100vh;height:100dvh;display:flex;flex-direction:column;
  max-width:680px;margin:0 auto;position:relative;isolation:isolate;
  background:transparent;
}
/* Soft glows instead of a tiled, masked dot pattern. The tiled layer plus
   mask-image produced flickering rectangular artifacts on some Android
   WebViews while scrolling. */
#app::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(62% 38% at 14% 6%,color-mix(in srgb,var(--ac) 10%,transparent),transparent 72%),
    radial-gradient(54% 34% at 88% 44%,color-mix(in srgb,var(--ac2) 9%,transparent),transparent 74%);
}
#v{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;z-index:1}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--ac2) 55%,var(--ln)) transparent}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--ac2),var(--ac));border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:active{background:var(--ac);background-clip:padding-box}
::placeholder{color:var(--mut);opacity:.72}
::selection{background:color-mix(in srgb,var(--ac) 35%,transparent)}
button{font-family:inherit;cursor:pointer;transition:transform .12s,opacity .12s,background .2s,border-color .2s}
button:active{transform:scale(.96);opacity:.88}
a{color:var(--ac)}
header{
  display:flex;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 96%,var(--sf)),color-mix(in srgb,var(--bg) 90%,var(--sf)));
  border-bottom:1px solid color-mix(in srgb,var(--ln) 70%,transparent);
  position:relative;z-index:5;
}
header h1{font:700 24px/1.1 "Cormorant Garamond",Literata,Georgia,serif;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:19px;line-height:1.15}
.ttl small{display:block;color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
main{flex:1;overflow-y:auto;padding:14px 16px 24px;overscroll-behavior:contain}
#v>main{position:relative}
.brandmark{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 42%,transparent),0 6px 18px rgba(0,0,0,.35)}
.wm{font:700 28px/1 "Cormorant Garamond",Literata,Georgia,serif;letter-spacing:.01em;flex:1;min-width:0}
.ib{border:0;background:none;color:var(--ac);font-size:15px;padding:8px 10px;border-radius:12px;min-height:42px;flex:none}
.ib.big{font-size:28px;line-height:1;padding:2px 10px}
.ib:active{background:color-mix(in srgb,var(--ac) 14%,transparent)}
/* Inline SVG icons. Glyph characters such as ⌕ and ✎ are missing from many
   system fonts and show up as empty boxes, so every control icon is drawn. */
.i{width:22px;height:22px;display:block;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib.big .i{width:25px;height:25px}
.send .i{width:21px;height:21px;stroke-width:2.1}
.ib .i.sm{width:18px;height:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn .i,.lnk .i{display:inline-block;width:16px;height:16px;stroke-width:2}
.btn.full .i,.btn.wide .i{width:18px;height:18px}
button .i{pointer-events:none}
.btn{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border:0;border-radius:14px;padding:13px 20px;font-size:15px;font-weight:650;letter-spacing:.01em;box-shadow:0 8px 22px color-mix(in srgb,var(--g1) 28%,transparent)}
.btn.s{background:var(--sf);color:var(--ink);border:1px solid var(--ln);box-shadow:var(--sh2)}
.btn.d{background:var(--sf);color:var(--dg);border:1px solid color-mix(in srgb,var(--dg) 42%,var(--ln));box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#e5484d,#b42345);color:#fff;border:0}
.btn.full{width:100%;padding:15px;border-radius:16px;font-size:16px}
.btn.wide{flex:1.4;border-radius:15px;padding:15px}
.send{width:46px;height:46px;border-radius:50%;padding:0;font-size:20px;flex:none;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--g1) 40%,transparent)}
.row{display:flex;align-items:center;gap:14px;padding:12px 8px;border-radius:16px;margin-bottom:2px}
.row:active{background:color-mix(in srgb,var(--sf) 82%,transparent)}
.row .t{flex:1;min-width:0}
.row b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.row time{color:var(--mut);font-size:12px;flex:none;align-self:flex-start;margin-top:5px}
.av{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--sf2);flex:none;display:grid;place-items:center;color:var(--ac);font-weight:700;overflow:hidden}
.av.sm{width:36px;height:36px;font-size:14px}
.av.big{width:68px;height:68px;font-size:26px;box-shadow:0 0 0 2px var(--bg),0 0 0 4px color-mix(in srgb,var(--ac) 48%,transparent)}
.av.lg{width:96px;height:96px;font-size:36px;border:2px solid var(--ln);transition:border-color .15s}
.av.xl{width:120px;height:120px;font-size:44px;border:2px solid color-mix(in srgb,var(--ac) 65%,var(--ln));box-shadow:0 0 44px var(--glow)}
.pk:active .av.lg{border-color:var(--ac)}
.empty{color:var(--mut);text-align:center;padding:56px 24px;line-height:1.6}
.msg{display:flex;gap:8px;margin:14px 0;align-items:flex-end}
.msg.u{flex-direction:row-reverse}
.msg .av{width:32px;height:32px;font-size:13px}
.msg.gp{margin-top:-7px}
.avs{width:32px;flex:none}
.mw{display:flex;flex-direction:column;max-width:84%;min-width:0}
.u .mw{align-items:flex-end}
.mw .bub{max-width:100%}
.bub{max-width:82%;padding:11px 15px;border-radius:22px 22px 22px 8px;background:var(--bot);border:1px solid var(--ln);font:16px/1.55 Literata,Georgia,serif;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:var(--sh2)}
.u .bub{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:transparent;border-radius:22px 22px 8px 22px;box-shadow:0 7px 20px color-mix(in srgb,var(--g1) 30%,transparent)}
.u .bub a{color:inherit}
.bub img{max-width:100%;height:auto;border-radius:12px;vertical-align:middle}
.bub a{color:var(--ac)}
.bub table{border-collapse:collapse}
.bub td,.bub th{border:1px solid var(--ln);padding:2px 6px}
.bub code{font-size:.9em;background:color-mix(in srgb,var(--bg) 80%,var(--sf2));padding:2px 5px;border-radius:6px}
.bub pre{white-space:pre-wrap;margin:.5em 0;background:color-mix(in srgb,var(--bg) 75%,transparent);padding:10px;border-radius:12px}
.bub p,.bub blockquote{margin:.4em 0}
.bub blockquote{border-left:3px solid var(--ln);padding-left:10px;color:var(--mut)}
.bub h1,.bub h2,.bub h3,.bub h4{font:700 1.1em Inter,system-ui,sans-serif;margin:.6em 0 .2em}
.bub ul,.bub ol{margin:.3em 0;padding-left:1.3em;white-space:normal}
.bub hr{border:0;border-top:1px solid var(--ln)}
.bub{font-size:var(--fs,16px);font-family:var(--ff,Literata,Georgia,serif)}
.hl .bub{outline:2px solid var(--ac);outline-offset:3px}
.dots::after{content:"●●●";letter-spacing:4px;font-size:9px;animation:b 1.2s infinite}
@keyframes b{50%{opacity:.2}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.tools{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.u .tools{justify-content:flex-end}
.tools button{font-size:13px;padding:6px 12px;border-radius:11px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);box-shadow:var(--sh2)}
.trow{margin:-2px 0 14px 40px}
.trow.u{margin-left:0;display:flex;justify-content:flex-end}
.trow .tools{margin-top:0}
.comp{display:flex;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));align-items:flex-end;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--bg) 82%,transparent));position:relative;z-index:4}
.comp textarea{flex:1;border-radius:24px;padding:12px 16px;max-height:120px;background:var(--sf);border:1px solid var(--ln);box-shadow:var(--sh2)}
#cb{display:flex;gap:8px;align-items:flex-end;flex:none}
textarea,input,select{width:100%;font:16px inherit;font-family:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 13px;outline:0;transition:border-color .15s,box-shadow .15s}
textarea:focus,input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
textarea{resize:none}
.sheet{position:fixed;inset:0;background:rgba(7,2,14,.72);display:flex;align-items:flex-end;z-index:20;animation:fade .18s var(--ease-out)}
#sh2 .sheet{z-index:30;background:rgba(7,2,14,.5)}
.sheet>div{position:relative;background:linear-gradient(180deg,var(--sf2),var(--sf) 38%);width:100%;max-width:680px;margin:0 auto;border-radius:28px 28px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto;box-shadow:var(--sh);animation:sheetUp .3s var(--ease-spring);border-top:1px solid color-mix(in srgb,var(--ac) 28%,transparent);transform-origin:50% 100%}
.sheet>div::before{content:"";position:absolute;top:0;left:22%;right:22%;height:1px;background:linear-gradient(90deg,transparent,var(--ac),transparent);opacity:.8}
.grab{display:block;width:42px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--ac2),var(--ac));margin:-6px auto 14px;opacity:.75}
.sheet h2{font:700 26px/1.1 "Cormorant Garamond",Literata,Georgia,serif;margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:16px;color:var(--ink);margin:0}
.chk input{width:20px;height:20px;accent-color:var(--ac);flex:none}
/* Chat options: compact, grouped rows instead of a wall of equal buttons. */
.opt-head{display:flex;align-items:flex-start;gap:12px;margin:0 0 14px}
.opt-head h2{margin:0;flex:1;min-width:0}
.opt-head p{margin:4px 0 0;color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt-head .ib{margin:-7px -7px 0 auto;color:var(--mut);width:40px;height:40px;display:grid;place-items:center}
.optsec{margin-top:17px}
.optsec h3{font:650 11px/1 Inter,system-ui;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:0 4px 7px}
.optrow{display:flex;align-items:center;gap:10px;width:100%;min-height:49px;padding:11px 13px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:14px;margin:0 0 7px;text-align:left;font-size:15px;font-family:inherit;box-shadow:0 1px 0 color-mix(in srgb,#fff 3%,transparent)}
.optrow .ol{flex:1;min-width:0;color:var(--mut);font-weight:500}
.optrow .ov{min-width:0;max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;font-weight:600}
.optrow .chev{color:var(--mut);width:18px;height:18px;display:grid;place-items:center;margin-left:1px;flex:none}.optrow .chev .i{width:16px;height:16px}
.optrow:active{transform:scale(.988);background:color-mix(in srgb,var(--ac) 7%,var(--sf))}
.optrow.danger{border-color:color-mix(in srgb,var(--dg) 40%,var(--ln));background:color-mix(in srgb,var(--dg) 6%,var(--sf))}
.optrow.danger .ol,.optrow.danger .ov{color:var(--dg)}
.optrow .av{width:32px;height:32px;font-size:13px;flex:none}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.optbtn{display:flex;align-items:center;gap:8px;min-height:46px;padding:11px 12px;border:1px solid var(--ln);border-radius:14px;background:var(--sf);color:var(--ink);font-size:14px;font-weight:600;font-family:inherit;text-align:left}
.optbtn .i{width:18px;height:18px;color:var(--ac);flex:none}
.optbtn:active{background:color-mix(in srgb,var(--ac) 8%,var(--sf))}
.optdanger{margin-top:19px;padding-top:15px;border-top:1px solid color-mix(in srgb,var(--dg) 24%,var(--ln))}
.switch{width:42px;height:25px;border-radius:99px;background:var(--sf2);border:1px solid var(--ln);position:relative;flex:none;transition:background var(--dur),border-color var(--dur)}
.switch i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--mut);transition:left var(--dur) var(--ease-spring),background var(--dur)}
.switch.on{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent}
.switch.on i{left:19px;background:#fff}
/* Content that is still loading gets a quiet shimmer instead of a blank row. */
.bsk{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.bsk .brow{display:flex;gap:12px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:10px;overflow:hidden}
.bsk .bthumb{width:64px;height:64px;border-radius:16px;flex:none;background:linear-gradient(90deg,var(--sf2),color-mix(in srgb,var(--ac) 9%,var(--sf2)),var(--sf2));background-size:220% 100%;animation:shimmer 1.5s linear infinite}
.bsk .blines{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.bsk .blines i{display:block;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--sf2),color-mix(in srgb,var(--ac) 9%,var(--sf2)),var(--sf2));background-size:220% 100%;animation:shimmer 1.5s linear infinite}
.bsk .blines i:nth-child(2){width:72%}
.bsk .blines i:nth-child(3){width:48%;height:8px}
/* A gentle way back to the newest message, shown only after scrolling up. */
.jump{position:absolute;right:17px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:7;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:1px solid color-mix(in srgb,var(--ac) 30%,var(--ln));background:color-mix(in srgb,var(--sf) 92%,transparent);color:var(--ac);box-shadow:var(--sh2);opacity:0;transform:translateY(8px) scale(.96);pointer-events:none;transition:opacity var(--dur) var(--ease-out),transform var(--dur) var(--ease-spring)}
.jump.show{opacity:1;transform:none;pointer-events:auto}
.jump .i{width:18px;height:18px}
.msg.anim{animation:msgIn .24s var(--ease-out)}
.acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.note{font-size:13px;color:var(--mut);margin:8px 0;line-height:1.45}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sf2);color:var(--ink);border:1px solid color-mix(in srgb,var(--ac) 32%,var(--ln));padding:11px 18px;border-radius:22px;font-size:14px;z-index:40;max-width:90%;text-align:center;animation:toastIn .24s var(--ease-out);box-shadow:var(--sh)}
#sn{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column-reverse;gap:8px;z-index:42;width:max-content;max-width:92%;pointer-events:none}
#sn>*{pointer-events:auto}
#sn .snack{display:flex;align-items:center;gap:10px;background:var(--sf2);color:var(--ink);border:1px solid color-mix(in srgb,var(--ac) 32%,var(--ln));padding:8px 10px 8px 16px;border-radius:22px;box-shadow:var(--sh);font-size:14px;animation:snackIn .24s var(--ease-out);max-width:100%;touch-action:pan-y;will-change:transform}
#sn .snack span{min-width:0}
#sn .snack .btn{padding:7px 14px;border-radius:16px;font-size:14px}
#sn .savewarn{border-color:color-mix(in srgb,var(--dg) 55%,var(--ln))}
.pinmark{display:inline-flex;vertical-align:-2px;margin-right:5px;color:var(--ac)}
.pinmark svg{width:15px;height:15px}
mark.fhit{background:color-mix(in srgb,var(--ac) 40%,transparent);color:inherit;border-radius:4px;padding:0 1px}
.msg.cur .bub{outline:2px solid color-mix(in srgb,var(--ac) 55%,transparent);outline-offset:2px}
.msg.c .bub{touch-action:pan-y pinch-zoom}
.morebar{display:flex;justify-content:center;padding:8px 0 16px}
.rel{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:15px 16px;margin-bottom:12px;box-shadow:var(--sh2)}
.rel.cur{border-color:color-mix(in srgb,var(--ac) 55%,var(--ln))}
.relh{display:flex;align-items:center;gap:12px}
.relv{flex:none;min-width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--acT);font-weight:800;font-size:15px}
.relh h2{display:block;font-size:16px;line-height:1.25;margin:0}
.relh small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.rell{margin:12px 0 0;padding-left:20px;color:var(--ink);font-size:14.5px;line-height:1.55}
.rell li{margin:0 0 7px}
.rell li:last-child{margin-bottom:0}
.srch{margin-bottom:14px;border-radius:16px}

async function checkUpdate(manual=false){
 const g=S.cfg;
 if(!g.repo){if(manual)toast('Set a GitHub owner/repo in Updates first');return}
 if(V.updChecking){if(manual)toast('Already checking…');return}
 V.updChecking=true;
 if(manual)toast('Checking for updates…');
 try{
  const repo=g.repo.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/^\/+|\/+$/g,'');
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo))throw Error('Use owner/repo, e.g. WiktorWojno/Hearth');
  const api='https://api.github.com/repos/'+repo+'/contents/www/index.html';
  const raw='https://raw.githubusercontent.com/'+repo+'/main/www/index.html';
  const native=!!window.Capacitor?.isNativePlatform?.();
  const etag=localStorage.getItem(UPD_ETAG)||'';
  const h={'accept':'application/vnd.github.raw'};
  if(g.gh)h.authorization='Bearer '+g.gh;
  if(etag&&native&&!g.gh)h['if-none-match']=etag;
  let r;
  try{r=await updFetch(api,h)}
  catch(e){if(/^404/.test(e.message))throw Error('Update file not found in '+repo);r=await updFetch(raw,g.gh?{authorization:'Bearer '+g.gh}:{})}

  if(r.status===304){if(manual)toast('You’re up to date (build '+VER+')');return}
  const m=r.text.match(/var VER=(\d+)/);
  if(!m)throw Error('The update file has no build number');
  const nv=+m[1];
  if(!/^\s*<!doctype html/i.test(r.text)||!/<\/html>\s*$/i.test(r.text)||r.text.length<20000)throw Error('The update download was incomplete. Try again.');
  setUpdMeta({latest:nv});
  if(nv<=VER){if(manual)toast('You’re up to date (build '+VER+')');return}
  if(String(localStorage.getItem(UPD_BAD)||'')===String(nv))throw Error('Build '+nv+' failed to start before. Waiting for a newer build.');
  if(r.etag)try{localStorage.setItem(UPD_ETAG,r.etag)}catch(e){}
  localStorage.setItem(UPD_OTA,r.text);
  localStorage.removeItem('hearth_ota_try');
  V.updReady=nv;
  setUpdMeta({available:nv,error:''});
  toast('Update '+nv+' downloaded. Restart to apply.');
  if(!V.loading)render();
 }catch(e){
  setUpdMeta({checked:Date.now(),error:e.message});
  if(manual)toast('Update check failed: '+e.message);else console.warn('Update check failed',e);
 }finally{V.updChecking=false}
}

 b.addEventListener('touchstart',e=>{if(V.busy||e.touches.length!==1||e.target.closest('a'))return;const t=e.touches[0];x0=t.clientX;y0=t.clientY;dx=dy=0;on=false;b.style.transition='none'},{passive:true});
 b.addEventListener('touchmove',e=>{if(e.touches.length!==1)return;const t=e.touches[0];dx=t.clientX-x0;dy=t.clientY-y0;
  if(!on&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.2)on=true;
  if(!on)return;if(e.cancelable)e.preventDefault();
  b.style.transform=`translateX(${Math.max(-70,Math.min(70,dx))}px)`;
  b.style.opacity=String(Math.max(.55,1-Math.abs(dx)/260));
 },{passive:false});
 const end=()=>{
  if(!on){b.style.transform='';b.style.opacity='';b.style.transition='';return}
  const move=Math.abs(dx)>52,dir=dx<0?1:-1;on=false;
  b.style.transition='transform .16s ease, opacity .16s ease';b.style.transform='';b.style.opacity='1';setTimeout(()=>{b.style.transition=''},180);
  if(move){swipeClick=Date.now()+350;swipeMsg(idx,dir)}
 };
 b.addEventListener('touchend',end);b.addEventListener('touchcancel',end);
}

function upd(){const h=S.chats[V.chat]||[],idx=h.length-1,b=document.querySelector(`.msg[data-i="${idx}"] .bub`);if(!b)return;
 if(V.shown==null){const now=performance.now();if(now-lastUpd<40)return;lastUpd=now}
 const t=V.shown!=null?V.shown:(h[idx]?.t||'');if(!t)return;b.innerHTML=rich(t);

function findHits(){
 const q=(V.fq||'').trim().toLowerCase();
 if(q.length<2||!V.chat)return[];
 return (S.chats[V.chat]||[]).map((m,i)=>strip(m.t).toLowerCase().includes(q)?i:-1).filter(i=>i>=0);
}
function findLabel(){
 const q=(V.fq||'').trim(),n=findHits().length;
 if(q.length<2)return'Type at least 2 letters';
 return n?((Math.min(V.fcur||0,n-1))+1)+' of '+n+' messages':'No matches';
}
function applyFind(){
 const main=$('main');if(!main||!V.chat)return;
 main.querySelectorAll('mark.fhit').forEach(m=>{const p=m.parentNode;m.replaceWith(document.createTextNode(m.textContent));p.normalize()});
 main.querySelectorAll('.msg.cur').forEach(m=>m.classList.remove('cur'));
 const q=(V.fq||'').trim();if(q.length<2)return;
 const hits=findHits();if(!hits.length){V.fcur=0;return}
 V.fcur=Math.max(0,Math.min(V.fcur||0,hits.length-1));
 const set=new Set(hits),cur=hits[V.fcur];
 const rx=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
 main.querySelectorAll('.msg').forEach(el=>{
  const idx=+el.dataset.i;if(!set.has(idx))return;
  if(idx===cur)el.classList.add('cur');
  const bub=el.querySelector('.bub');if(!bub)return;
  const w=document.createTreeWalker(bub,NodeFilter.SHOW_TEXT),nodes=[];
  while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{
   const txt=n.nodeValue||'';if(!txt)return;
   rx.lastIndex=0;if(!rx.test(txt))return;
   rx.lastIndex=0;const f=document.createDocumentFragment();let last=0,m;
   while((m=rx.exec(txt))){
    if(!m[0])break;
    if(m.index>last)f.append(document.createTextNode(txt.slice(last,m.index)));
    const mk=document.createElement('mark');mk.className='fhit';mk.textContent=m[0];f.append(mk);
    last=m.index+m[0].length;
   }
   if(last<txt.length)f.append(document.createTextNode(txt.slice(last)));
   n.parentNode.replaceChild(f,n);
  });
 });
 const e=main.querySelector(`.msg[data-i="${cur}"]`);
 if(e&&e.scrollIntoView)e.scrollIntoView({block:'center',behavior:'smooth'});
}
function ensureHit(idx){
 const m=S.chats[V.chat]||[];if(idx==null||idx<0)return false;
 const lim=V.limit||CHATWIN,start=Math.max(0,m.length-lim);
 if(idx>=start)return false;
 V.limit=Math.min(m.length,Math.max(lim,m.length-idx+2));return true;
}

 V.fcur=((V.fcur||0)+d+hits.length)%hits.length;
 if(ensureHit(hits[V.fcur])){render();const n=$('#fq');if(n){n.focus();try{n.setSelectionRange(n.value.length,n.value.length)}catch(e){}}}
 applyFind();

}
