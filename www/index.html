async function sem(c,h){const em=S.models.find(m=>m.id===S.cfg.emb),p=em&&S.provs.find(x=>x.id===em.pid);if(!p||p.fmt==='anthropic')return null;const g={url:p.url,key:p.key,model:em.mid},K=[];
 const add=(t,k)=>(t||'').split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean).forEach(x=>K.push({k,t:x}));add(c.rag,'r');add(P().rag,'r');
 for(const id of S.links[c.id]||[])S.books.find(x=>x.id===id)?.entries.forEach(e=>{if(e.on&&!e.constant&&!e.keys.length)K.push({k:'l',t:e.content})});
 if(!K.length)return null;S.emb=S.emb||{};const key=t=>em.mid+':'+t.length+':'+hs(t),need=[...new Set(K.map(x=>x.t))].filter(t=>!S.emb[key(t)]);
 for(let i=0;i<need.length;i+=32){const v=await embed(g,need.slice(i,i+32));need.slice(i,i+32).forEach((t,j)=>S.emb[key(t)]=v[j])}
 if(need.length)save();const qv=(await embed(g,[h.slice(-3).map(m=>strip(m.t)).join(' ').slice(-1000)||'.']))[0],sc=K.map(x=>({...x,s:cos(qv,S.emb[key(x.t)])})).sort((a,b)=>b.s-a.s);
 return{rag:sc.filter(x=>x.k==='r'&&x.s>=.3).slice(0,3).map(x=>x.t).join('\n\n'),lore:sc.filter(x=>x.k==='l'&&x.s>=.35).slice(0,2).map(x=>rep(x.t,c))}}

async function summarize(c){const mc=S.cfg.mem,h=S.chats[c.id];if(!mc.on||!h)return;
 const live=h.filter(x=>!x.mm),wait=live.slice(0,Math.max(0,live.length-(S.cfg.hist||40)));if(wait.length<mc.every)return;
 const batch=wait.slice(0,mc.per),g=resolve({model:mc.model||c.model});if(!g)return;
 try{const t=await llm('You write concise memory notes for a roleplay. Summarize the messages in 3 to 5 sentences, third person, keeping names, facts, promises and relationship changes. Output only the summary.',[{role:'user',content:batch.map(x=>(x.r==='u'?P().name:c.name)+': '+strip(x.t)).join('\n')}],()=>{},undefined,{...g,max:300});

 `\n[${u}]\n${rep(P().desc,c)||'(no description)'}${P().lore?'\n'+rep(P().lore,c):''}\n`+(L?`\n[World info]\n${L}\n`:'')+(rg?`\n[Relevant background]\n${rg}\n`:'')+(mm.length?`\n[Earlier in the story]\n${mm.join('\n')}\n`:'')+(c.ex?`\n[Example dialogue]\n${rep(c.ex,c)}\n`:'');

async function llm(sys,msgs,on,signal,g){const an=g.fmt==='anthropic',base=(g.url||'').replace(/\/$/,'');
 const res=await fetch(base+(an?'/messages':'/chat/completions'),{method:'POST',signal,
  headers:an?{'content-type':'application/json','x-api-key':g.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}:{'content-type':'application/json',...(g.key?{authorization:'Bearer '+g.key}:{})},
  body:JSON.stringify(an?{model:g.model,max_tokens:g.max,temperature:g.temp,system:sys,messages:msgs,stream:true}:{model:g.model,messages:[{role:'system',content:sys},...msgs],temperature:g.temp,top_p:g.top,max_tokens:g.max,stream:true})});
 if(!res.ok)throw Error(res.status+' '+(await res.text()).slice(0,200));
 const rd=res.body.getReader(),dec=new TextDecoder();let buf='',out='';
 for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
  for(const l of ls){if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(d==='[DONE]')continue;
   try{const j=JSON.parse(d),t=an?(j.delta?.text||''):(j.choices?.[0]?.delta?.content||'');if(t){out+=t;on(out)}}catch(e){}}}
 return out}

  bak:()=>dl('hearth-backup.json',JSON.stringify({...S,emb:undefined,lock:undefined,provs:S.provs.map(p=>({...p,key:''})),cfg:{...S.cfg,gh:'',key:''}})),rest:pick,

  reset:()=>{delete S.chats[c.id];V.sheet=null;save();openChat(c.id)},
  delchar:()=>{S.chars=S.chars.filter(x=>x.id!==c.id);delete S.chats[c.id];delete S.links[c.id];delete S.old[c.id];V.chat=null;V.sheet=null;save();render()},
  
  delbook:()=>{S.books=S.books.filter(b=>b.id!==V.sheet.id);for(const k in S.links)S.links[k]=S.links[k].filter(x=>x!==V.sheet.id);V.sheet=null;save();render()},
  
  
  acctadd:()=>{V.form={k:'acct',mode:'add'};render()},

  acctswitch:async()=>{if(!idbOK)return toast('Storage not ready');const id=t.dataset.id;if(id===ACCT_ID)return;try{V.ctl?.abort()}catch(e){}await new Promise(r=>setTimeout(r,60));await flushSave();await loadAcct(id,'accounts');toast('Switched to '+(ACCOUNTS.find(a=>a.id===id)?.name||'account'))},
  acctsave:async()=>{const F=V.form,n=($('#a_n')?.value||'').trim();if(!F||!n)return toast('Enter a name');if(!idbOK)return toast('Storage not ready');
   if(F.mode==='ren'){const a=ACCOUNTS.find(x=>x.id===F.id);if(a){a.name=n;await saveAccounts()}V.form=null;render();return}
   try{V.ctl?.abort()}catch(e){}await new Promise(r=>setTimeout(r,60));await flushSave();
   const id=uid(),cur=S.cfg;ACCOUNTS.push({id,name:n});await saveAccounts();
   const nu=fresh();nu.cfg=Object.assign({},CFG0,{theme:cur.theme,fs:cur.fs,ff:cur.ff});ACCT_ID=id;await idbSet(nu);await loadAcct(id,'accounts');toast('Created “'+n+'”')},
  acctdelok:async()=>{const F=V.form;if(!F||ACCOUNTS.length<2||!idbOK)return;const id=F.id,was=id===ACCT_ID;clearTimeout(tm);

  use:()=>{S.persona=id;save();render()},

  delp:()=>{const p=V.sheet.p;S.personas=S.personas.filter(x=>x!==p);if(S.persona===p.id)S.persona=null;V.sheet=null;save();render()}
 })[a]?.()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='la'){S.lock.after=+t.value;save()}
 if(t.id==='bs'){V.br.sort=t.value;chubSearch()}
 if(t.id==='bn'){V.br.nsfw=t.checked;chubSearch()}
 if(/^g_/.test(t.id)){readCfg();save();applyTheme()}
 if(t.dataset.tag&&t.value.trim())addTag(t);
 if(t.dataset.lk&&V.ed){const l=V.ed.o.links;if(t.checked){if(!l.includes(t.dataset.lk))l.push(t.dataset.lk)}else V.ed.o.links=l.filter(x=>x!==t.dataset.lk)}
 if(t.id==='ps'){S.persona=t.value||null;save()}
 if(t.id==='bgs'){C().bg=t.value;save();render()}
 if(t.id==='rm'){C().model=t.value;save();render()}
 if(t.id==='emb_m'){S.cfg.emb=t.value;save()}
 if(t.id==='mem_on'){S.cfg.mem.on=t.value==='On';save()}
 if(t.id==='mem_m'){S.cfg.mem.model=t.value;save()}
 if(t.id==='prov'){readCfg();if(PRE[t.value])S.cfg.url=PRE[t.value];V.sheet={t:'prov'};render()}
 if(t.dataset.b){const c=C(),l=new Set(S.links[c.id]||[]);t.checked?l.add(t.dataset.b):l.delete(t.dataset.b);S.links[c.id]=[...l];save()}
 if(t.dataset.e!==undefined){S.books.find(b=>b.id===V.sheet.id).entries[+t.dataset.e].on=t.checked;save()}});
async function flushSave(){clearTimeout(tm);if(!idbOK)return;S.ts=Date.now();await idbSet(S)}
async function loadAcct(id,tab){try{V.ctl?.abort()}catch(e){}await new Promise(r=>setTimeout(r,60));ACCT_ID=id;try{localStorage.setItem('hearth_acct',id)}catch(e){}
 const d=await idbGet().catch(()=>null);S=Object.assign(fresh(),d||{});fix();applyTheme();
 Object.assign(V,{chat:null,sheet:null,form:null,edit:null,ed:null,prev:null,busy:false,ctl:null,forgot:false,tab:tab||'home'});V.locked=!!S.lock?.hash;render()}
idbRaw('accounts').then(async accs=>{
 if(!accs||!accs.length){accs=[{id:'default',name:'Default'}];await saveAccountsTo(accs)}
 ACCOUNTS=accs;let a=null;try{a=localStorage.getItem('hearth_acct')}catch(e){}
 ACCT_ID=accs.find(x=>x.id===a)?a:accs[0].id;
 let d=await idbGet();
 if(!d&&ACCT_ID==='default'){const r=await idbRaw('S_default');if(r){d=r;await idbRaw('S',r)}}
 if(d&&(ACCT_ID!=='default'||(d.ts||0)>=(S.ts||0))){S=Object.assign(fresh(),d);fix();applyTheme()}
 else if(ACCT_ID!=='default'){S=fresh();fix();applyTheme()}
 idbOK=true;V.loading=false;V.locked=!!S.lock?.hash;idbSet(S).then(()=>{try{localStorage.removeItem('hearth')}catch(e){}}).catch(()=>{});render()}).catch(()=>{V.loading=false;V.locked=!!S.lock?.hash;render()});
setTimeout(()=>{if(V.loading){V.loading=false;V.locked=!!S.lock?.hash;render()}},3000);
document.addEventListener('visibilitychange',()=>{if(!S.lock?.hash||V.loading)return;if(document.hidden){V.hid=Date.now();return}
 if(Date.now()<(V.skipUntil||0))return;const m=S.lock.after??5;if(m>=0&&Date.now()-(V.hid||0)>=m*60000){V.locked=true;render()}});
document.addEventListener('click',e=>{if(e.target?.type==='file')V.skipUntil=Date.now()+180000},true);
document.addEventListener('input',e=>{if(e.target.id!=='fq')return;const q=e.target.value.toLowerCase().trim(),c=C();
 $('#fr').innerHTML=q.length<2?'':S.chats[c.id].map((m,i)=>[m,i]).filter(([m])=>strip(m.t).toLowerCase().includes(q)).slice(0,30).map(([m,i])=>`<div class="row" data-a="goto" data-i="${i}"><div class="t"><b>${m.r==='u'?esc(P().name):esc(c.name)}</b><small>${esc(strip(m.t).slice(0,90))}</small></div></div>`).join('')||'<p class="note">No matches.</p>'});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset?.tag){e.preventDefault();addTag(e.target)}if(e.key==='Enter'&&e.target.id==='lk')document.querySelector('[data-a=unlock]')?.click();if(e.key==='Enter'&&e.target.id==='bq')chubSearch()});
applyTheme();setTimeout(()=>{if(Date.now()-(S.lastUpd||0)>216e5){S.lastUpd=Date.now();save();checkUpdate(false)}},3000);document.addEventListener('mousedown',e=>{if(e.target.closest('.comp button'))e.preventDefault()});
addEventListener('popstate',()=>{if(pop){pop=false;return}hd=Math.max(0,hd-1);if(V.sheet)V.sheet=null;else if(V.chat){V.ctl?.abort();V.chat=null;V.edit=null}else if(V.tab!=='home')V.tab='home';render()});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
