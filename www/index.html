<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hearth</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#3f4ccf"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
:root{--bg:#f3f4f9;--sf:#fff;--ink:#171a2b;--mut:#6a6f89;--ac:#4b53e0;--acT:#fff;--ln:#e1e4ef;--me:#4b53e0;--meT:#fff;--bot:#fff;--dg:#c62828;--sh:0 8px 30px rgba(20,24,60,.18);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f10;--sf:#161617;--ink:#f4f4f5;--mut:#8e8e96;--ac:#8c96ff;--acT:#10122a;--ln:#2a2a2e;--me:#4650d6;--meT:#fff;--bot:#18181a;--dg:#ff8a80;--sh:0 8px 30px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0f10;--sf:#161617;--ink:#f4f4f5;--mut:#8e8e96;--ac:#8c96ff;--acT:#10122a;--ln:#2a2a2e;--me:#4650d6;--meT:#fff;--bot:#18181a;--dg:#ff8a80;--sh:0 8px 30px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;background:var(--bg)}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--sf);border-bottom:1px solid var(--ln)}
header h1{font:600 20px Literata,Georgia,serif;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttl{flex:1;min-width:0}.ttl h1{font-size:17px;line-height:1.2}.ttl small{display:block;color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;overflow-y:auto;padding:12px 14px;overscroll-behavior:contain}
nav{display:flex;background:var(--sf);border-top:1px solid var(--ln)}
nav button{flex:1;padding:12px 0 13px;border:0;background:none;color:var(--mut);font-size:14px;font-weight:500;position:relative}
nav button.on{color:var(--ac)}nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--ac)}
button{font-family:inherit;cursor:pointer;transition:transform .12s,opacity .12s,background .2s}button:active{transform:scale(.95);opacity:.85}
.ib{border:0;background:none;color:var(--ac);font-size:15px;padding:8px 10px;border-radius:10px;min-height:40px}.ib.big{font-size:28px;line-height:1;padding:4px 10px}
.btn{background:var(--ac);color:var(--acT);border:0;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600}
.btn.s{background:none;color:var(--ac);border:1px solid var(--ln)}.btn.d{background:none;color:var(--dg);border:1px solid var(--ln)}
