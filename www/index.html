<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hearth</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#3f4ccf"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
:root{--bg:#f3f4f9;--sf:#fff;--ink:#171a2b;--mut:#6a6f89;--ac:#4b53e0;--acT:#fff;--ln:#e1e4ef;--me:#4b53e0;--meT:#fff;--bot:#fff;--dg:#c62828;--sh:0 8px 30px rgba(20,24,60,.18);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1018;--sf:#171a28;--ink:#e9ebf7;--mut:#8a90ae;--ac:#8c96ff;--acT:#10122a;--ln:#262a3e;--me:#4650d6;--meT:#fff;--bot:#1b1e2e;--dg:#ff8a80;--sh:0 8px 30px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1018;--sf:#171a28;--ink:#e9ebf7;--mut:#8a90ae;--ac:#8c96ff;--acT:#10122a;--ln:#262a3e;--me:#4650d6;--meT:#fff;--bot:#1b1e2e;--dg:#ff8a80;--sh:0 8px 30px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;background:var(--bg)}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--sf);border-bottom:1px solid var(--ln)}
header h1{font:600 20px Literata,Georgia,serif;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttl{flex:1;min-width:0}.ttl h1{font-size:17px;line-height:1.2}.ttl small{display:block;color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;overflow-y:auto;padding:12px 14px;overscroll-behavior:contain}
nav{display:flex;background:var(--sf);border-top:1px solid var(--ln)}
nav button{flex:1;padding:12px 0 13px;border:0;background:none;color:var(--mut);font-size:14px;font-weight:500;position:relative}
nav button.on{color:var(--ac)}nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--ac)}
button{font-family:inherit;cursor:pointer;transition:transform .12s,opacity .12s,background .2s}button:active{transform:scale(.95);opacity:.85}
.ib{border:0;background:none;color:var(--ac);font-size:15px;padding:8px 10px;border-radius:10px;min-height:40px}.ib.big{font-size:28px;line-height:1;padding:4px 10px}
.btn{background:var(--ac);color:var(--acT);border:0;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600}
.btn.s{background:none;color:var(--ac);border:1px solid var(--ln)}.btn.d{background:none;color:var(--dg);border:1px solid var(--ln)}
.send{width:44px;height:44px;border-radius:50%;padding:0;font-size:20px;flex:none}
.row{display:flex;align-items:center;gap:14px;padding:11px 10px;border-radius:14px;margin-bottom:2px}.row:active{background:var(--sf)}
.row .t{flex:1;min-width:0}.row b{display:block}.row small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--ln);flex:none;display:grid;place-items:center;color:var(--mut);font-weight:600}
.av.sm{width:36px;height:36px;font-size:14px}
.empty{color:var(--mut);text-align:center;padding:60px 24px;line-height:1.6}
.msg{display:flex;gap:8px;margin:14px 0;align-items:flex-end}.msg.u{flex-direction:row-reverse}
.msg .av{width:32px;height:32px;font-size:13px}
.bub{max-width:82%;padding:10px 14px;border-radius:20px 20px 20px 6px;background:var(--bot);border:1px solid var(--ln);font:16px/1.55 Literata,Georgia,serif;white-space:pre-wrap;overflow-wrap:anywhere}
.u .bub{background:var(--me);color:var(--meT);border-color:transparent;border-radius:20px 20px 6px 20px}.u .bub a{color:inherit}
.bub img{max-width:100%;height:auto;border-radius:10px;vertical-align:middle}.bub a{color:var(--ac)}.bub table{border-collapse:collapse}.bub td,.bub th{border:1px solid var(--ln);padding:2px 6px}.bub code{font-size:.9em;background:var(--bg);color:var(--ink);padding:1px 4px;border-radius:4px}.bub pre{white-space:pre-wrap;margin:.4em 0}.bub p,.bub blockquote{margin:.4em 0}.bub blockquote{border-left:3px solid var(--ln);padding-left:10px;color:var(--mut)}
.tools{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.u .tools{justify-content:flex-end}.tools button{font-size:13px;padding:6px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);color:var(--ink)}
.comp{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--ln);background:var(--sf);align-items:flex-end}
textarea,input,select{width:100%;font:16px inherit;font-family:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:11px 12px;outline:0}
textarea:focus,input:focus,select:focus{border-color:var(--ac)}
.comp textarea{border-radius:22px;padding:11px 16px;max-height:120px}textarea{resize:none}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:20;animation:fade .2s}
.sheet>div{background:var(--sf);width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto;box-shadow:var(--sh);animation:up .22s ease-out}
.grab{display:block;width:40px;height:4px;border-radius:2px;background:var(--ln);margin:-6px auto 14px}
.sheet h2{font:600 19px Literata,Georgia,serif;margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 5px}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:16px;color:var(--ink);margin:0}.chk input{width:20px;height:20px;accent-color:var(--ac)}
.acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.note{font-size:13px;color:var(--mut);margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;z-index:40;max-width:90%;text-align:center;animation:fade .2s}
.dots::after{content:"…";animation:b 1s infinite}
@keyframes b{50%{opacity:.2}}@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}
</style></head><body><div id="app"></div>
<input type="file" id="f" accept=".png,.json,image/png,application/json" multiple hidden>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
let S={chars:[],books:[],personas:[],chats:{},links:{},persona:null};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('hearth')||'{}'))}catch(e){}
let saveErr=false;
const save=()=>{try{localStorage.setItem('hearth',JSON.stringify(S));saveErr=false}catch(e){saveErr=true}};
let V={tab:'chars',chat:null,sheet:null,busy:false,edit:null,ctl:null};
S.cfg=Object.assign({html:true,theme:'auto',prov:'openai',url:'https://api.openai.com/v1',key:'',model:'',temp:0.9,max:600,top:1,sys:''},S.cfg);
const PRE={openai:'https://api.openai.com/v1',openrouter:'https://openrouter.ai/api/v1',anthropic:'https://api.anthropic.com/v1',local:'http://localhost:5001/v1'};
let M=[],hd=0,pop=false;
const toast=m=>{document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),2200)};
const strip=t=>t.replace(/<[^>]*>/g,'').replace(/[*`]/g,'');
const applyTheme=()=>{const t=S.cfg.theme;if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme};
function syncHist(){const w=(V.chat?1:0)+(V.sheet?1:0);if(w>hd){while(hd<w){history.pushState({},'');hd++}}else if(w<hd){pop=true;history.go(w-hd);hd=w}}
async function dl(n,t){try{const f=new File([t],n,{type:'text/plain'});if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(t);toast('Copied to clipboard. Paste it into a note to keep it.')}catch(e){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t]));a.download=n;a.click()}}
async function fetchModels(){readCfg();const g=S.cfg,an=g.prov==='anthropic';
 try{const r=await fetch(g.url.replace(/\/$/,'')+'/models',{headers:an?{'x-api-key':g.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}:(g.key?{authorization:'Bearer '+g.key}:{})});
  if(!r.ok)throw Error(r.status);const j=await r.json();M=(j.data||j.models||[]).map(m=>m.id||m.name||m).filter(x=>typeof x==='string').sort();
  V.sheet={t:'api'};render();toast(M.length+' models found. Tap the Model field to pick one.')}
 catch(e){V.sheet={t:'api'};render();toast('Could not reach the server: '+e.message)}};
const OK=new Set('img span b i em strong u s del br p div a font center small big sub sup code pre hr blockquote ul ol li h1 h2 h3 h4 h5 h6 table thead tbody tr td th details summary mark q cite abbr'.split(' '));
const AT=new Set('style alt width height color size title align colspan rowspan open'.split(' '));
const DROP=/^(script|style|iframe|object|embed|link|meta|svg|math|form|textarea|select|button|input|video|audio|base|template|noscript)$/;
const BAD=/url\s*\(|expression|@import|javascript:|behavior|position\s*:\s*(fixed|absolute|sticky)|z-index/i;
function clean(n){for(const c of [...n.childNodes]){if(c.nodeType===3)continue;if(c.nodeType!==1){c.remove();continue}
 const t=c.tagName.toLowerCase();
 if(DROP.test(t)){c.remove();continue}
 if(!OK.has(t)){clean(c);c.replaceWith(...c.childNodes);continue}
 for(const a of [...c.attributes]){const k=a.name.toLowerCase(),v=a.value.trim();
  const ok=k==='src'?t==='img'&&/^(https?:|data:image\/(png|jpe?g|gif|webp|avif);)/i.test(v):k==='href'?t==='a'&&/^https?:/i.test(v):k==='style'?!BAD.test(v):AT.has(k);
  if(!ok)c.removeAttribute(a.name)}
 if(t==='a'){c.target='_blank';c.rel='noopener noreferrer nofollow'}
 if(t==='img'){c.loading='lazy';c.referrerPolicy='no-referrer'}
 clean(c)}}
function md(n){for(const c of [...n.childNodes]){if(c.nodeType===3){if(/[*`]/.test(c.data)){const s=document.createElement('span');
  s.innerHTML=esc(c.data).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\n]+)\*/g,'<i>$1</i>');c.replaceWith(...s.childNodes)}}
  else if(c.nodeType===1&&!/^(code|pre)$/i.test(c.tagName))md(c)}}
function rich(t){if(S.cfg.html===false)return esc(t);
 const b=new DOMParser().parseFromString('<body>'+t,'text/html').body;clean(b);md(b);return b.innerHTML}
const readCfg=()=>{if(!$('#g_url'))return;const g=S.cfg;g.prov=$('#prov').value;g.url=$('#g_url').value.trim();g.key=$('#g_key').value.trim();g.model=$('#g_model').value.trim();g.temp=+$('#g_temp').value;g.max=+$('#g_max').value||600;g.top=+$('#g_top').value||1;g.sys=$('#g_sys').value;g.html=$('#g_html').checked;g.theme=$('#g_theme').value};

/* ---------- import ---------- */
const lat=b=>{let s='';for(const x of b)s+=String.fromCharCode(x);return s};
function pngText(buf){const d=new DataView(buf),u=new Uint8Array(buf),o={};let p=8;
 while(p<buf.byteLength-8){const n=d.getUint32(p),t=lat(u.slice(p+4,p+8));
  if(t==='tEXt'){const b=u.slice(p+8,p+8+n),z=b.indexOf(0);o[lat(b.slice(0,z))]=lat(b.slice(z+1))}
  p+=12+n;if(t==='IEND')break}return o}
const b64json=s=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0))));
function thumb(file){return new Promise(r=>{const i=new Image(),url=URL.createObjectURL(file);
 i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),m=Math.min(i.width,i.height);
  x.drawImage(i,(i.width-m)/2,(i.height-m)/4>0?(i.height-m)/4:0,m,m,0,0,256,256);URL.revokeObjectURL(url);r(c.toDataURL('image/jpeg',.8))};
 i.onerror=()=>r('');i.src=url})}
function normBook(j,name){const raw=j.entries||[],list=Array.isArray(raw)?raw:Object.values(raw);
 return{id:uid(),name:j.name||name||'Lorebook',entries:list.map(e=>({
  name:e.comment||e.name||'',keys:[].concat(e.keys||e.key||[]).filter(Boolean),content:e.content||'',
  constant:!!e.constant,on:e.enabled!==false&&!e.disable})).filter(e=>e.content)}}
function addChar(j,img,fname){const d=j.data||j;if(!d.name)throw Error('No character data found');
 const c={id:uid(),name:d.name,desc:d.description||'',pers:d.personality||'',scen:d.scenario||'',
  first:d.first_mes||'',alts:d.alternate_greetings||[],ex:d.mes_example||'',sys:d.system_prompt||'',img};
 S.chars.push(c);
 if(d.character_book&&(d.character_book.entries||[]).length){const b=normBook(d.character_book,d.name+' lore');S.books.push(b);S.links[c.id]=[b.id]}
 return c.name}
async function importFiles(files){const msg=[];
 for(const f of files){try{
  if(/png$/i.test(f.name)||f.type==='image/png'){const t=pngText(await f.arrayBuffer()),k=t.ccv3||t.chara;
   if(!k)throw Error('no character data in this PNG');msg.push('Added '+addChar(b64json(k),await thumb(f)))}
  else{const j=JSON.parse(await f.text());if(j.chars&&j.books){S=Object.assign(S,j);msg.push('Restored backup');continue}
   if(j.entries||j.character_book===undefined&&j.data?.entries){const b=normBook(j,f.name.replace(/\.json$/i,''));S.books.push(b);msg.push('Added lorebook '+b.name)}
   else msg.push('Added '+addChar(j,''))}
 }catch(e){msg.push(f.name+': '+e.message)}}
 save();V.tab=S.books.length&&!S.chars.length?'lore':V.tab;render();
 V.sheet={t:'info',m:msg.join('\n')+(saveErr?'\nStorage is full. Delete something to keep new imports.':'')};render()}
$('#f').onchange=e=>{importFiles([...e.target.files]);e.target.value=''};
const pick=()=>$('#f').click();

/* ---------- chat ---------- */
const P=()=>S.personas.find(p=>p.id===S.persona)||{name:'You',desc:''};
const C=()=>S.chars.find(c=>c.id===V.chat);
const rep=(s,c)=>(s||'').replace(/{{char}}/gi,c.name).replace(/{{user}}/gi,P().name);
function lore(c,msgs){const text=msgs.slice(-6).map(m=>m.t).join('\n').toLowerCase(),out=[];
 for(const id of S.links[c.id]||[]){const b=S.books.find(b=>b.id===id);if(!b)continue;
  for(const e of b.entries){if(!e.on)continue;
   const hit=e.constant||e.keys.some(k=>{try{const m=/^\/(.+)\/([a-z]*)$/.exec(k);return m?new RegExp(m[1],m[2]||'i').test(text):text.includes(k.toLowerCase())}catch(x){return false}});
   if(hit)out.push(rep(e.content,c))}}
 return out.slice(0,8).join('\n\n').slice(0,3000)}
function build(c,h,cont){const u=P().name,L=lore(c,h);
 const head=rep(S.cfg.sys,c)||`You are roleplaying as ${c.name} in an ongoing chat with ${u}. Stay in character and write only ${c.name}’s next reply. Never write ${u}’s words or actions.`;
 const sys=head+'\n\n'+(c.sys?rep(c.sys,c)+'\n\n':'')+`[${c.name}]\n${rep(c.desc,c)}\n`+(c.pers?`Personality: ${rep(c.pers,c)}\n`:'')+(c.scen?`Scenario: ${rep(c.scen,c)}\n`:'')+
 `\n[${u}]\n${rep(P().desc,c)||'(no description)'}\n`+(L?`\n[World info]\n${L}\n`:'')+(c.ex?`\n[Example dialogue]\n${rep(c.ex,c)}\n`:'');
 const m=[];for(const x of h.slice(-40)){const r=x.r==='u'?'user':'assistant';if(m.length&&m[m.length-1].role===r)m[m.length-1].content+='\n\n'+x.t;else m.push({role:r,content:x.t})}
 if(cont)m.push({role:'user',content:`[Continue ${c.name}’s last message from exactly where it stopped. Do not repeat it.]`});
 if(!m.length||m[0].role!=='user')m.unshift({role:'user',content:'[Start of roleplay]'});
 return{sys,msgs:m}}
async function llm(sys,msgs,on,signal){const g=S.cfg,an=g.prov==='anthropic',base=(g.url||'').replace(/\/$/,'');
 const res=await fetch(base+(an?'/messages':'/chat/completions'),{method:'POST',signal,
  headers:an?{'content-type':'application/json','x-api-key':g.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}:{'content-type':'application/json',...(g.key?{authorization:'Bearer '+g.key}:{})},
  body:JSON.stringify(an?{model:g.model,max_tokens:g.max,temperature:g.temp,system:sys,messages:msgs,stream:true}:{model:g.model,messages:[{role:'system',content:sys},...msgs],temperature:g.temp,top_p:g.top,max_tokens:g.max,stream:true})});
 if(!res.ok)throw Error(res.status+' '+(await res.text()).slice(0,200));
 const rd=res.body.getReader(),dec=new TextDecoder();let buf='',out='';
 for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
  for(const l of ls){if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(d==='[DONE]')continue;
   try{const j=JSON.parse(d),t=an?(j.delta?.text||''):(j.choices?.[0]?.delta?.content||'');if(t){out+=t;on(out)}}catch(e){}}}
 return out}
function openChat(id){V.chat=id;const c=C();if(!S.chats[id]?.length){const g=[c.first,...(c.alts||[])].filter(Boolean).map(x=>rep(x,c));S.chats[id]=g.length?[{r:'c',t:g[0],s:g,i:0}]:[];save()}render(true)}
async function gen(mode='new'){const c=C(),h=S.chats[c.id],g=S.cfg;
 if(!g.model||!g.url){V.sheet={t:'api'};return render()}
 let m,base='',hist;
 if(mode==='new'){m={r:'c',t:'',s:[''],i:0};h.push(m);hist=h.slice(0,-1)}
 else if(mode==='swipe'){m=h[h.length-1];m.s=m.s||[m.t];m.s.push('');m.i=m.s.length-1;m.t='';hist=h.slice(0,-1)}
 else{m=h[h.length-1];base=m.t;hist=h}
 V.busy=true;V.ctl=new AbortController();render(true);
 const set=t=>{m.t=base+(t.startsWith(c.name+':')?t.slice(c.name.length+1).trimStart():t);m.s&&(m.s[m.i||0]=m.t)};
 try{const{sys,msgs}=build(c,hist,mode==='cont');await llm(sys,msgs,t=>{set(t);upd()},V.ctl.signal)}
 catch(e){if(e.name!=='AbortError')V.sheet={t:'info',m:'Request failed: '+e.message+(/Failed to fetch|Load failed/.test(e.message)?'\nCheck the URL and key, and that the server allows browser (CORS) requests.':'')}}
 if(!m.t&&mode!=='cont'){if(mode==='new')h.pop();else{m.s.pop();m.i=m.s.length-1;m.t=m.s[m.i]}}
 V.busy=false;V.ctl=null;save();render(true)}
function swp(d){const h=S.chats[V.chat],m=h[h.length-1];if(!m||m.r!=='c'||V.busy)return;m.s=m.s||[m.t];m.i=m.i||0;
 if(d>0&&m.i===m.s.length-1)return gen('swipe');const n=m.i+d;if(n<0||n>=m.s.length)return;m.i=n;m.t=m.s[n];save();render()}
const swb=x=>`<div class="tools"><button data-a="sl">◀</button><span class="note" style="align-self:center;margin:0">${(x.i||0)+1}/${(x.s||[x.t]).length}</span><button data-a="sr">▶</button><button data-a="cont">Continue</button></div>`;
function upd(){const b=document.querySelector('.msg:last-child .bub');if(b){b.innerHTML=rich(S.chats[V.chat].slice(-1)[0].t);const m=$('main');if(m.scrollHeight-m.scrollTop-m.clientHeight<200)m.scrollTop=m.scrollHeight}}
function send(){const i=$('#in'),t=i.value.trim();if(!t||V.busy)return;S.chats[V.chat].push({r:'u',t});(S.act=S.act||{})[V.chat]=Date.now();i.value='';save();gen()}

/* ---------- views ---------- */
const av=(c,cls='')=>c.img?`<img class="av ${cls}" src="${c.img}" alt="">`:`<div class="av ${cls}">${esc((c.name||'?')[0])}</div>`;
function sheetHtml(){const s=V.sheet;if(!s)return'';let h='';
 if(s.t==='info')h=`<p style="white-space:pre-wrap;margin:0 0 4px">${esc(s.m)}</p><div class="acts"><button class="btn" data-a="close">OK</button></div>`;
 if(s.t==='edit')h=`<h2>Edit message</h2><textarea id="em" rows="8">${esc(S.chats[V.chat][s.i].t)}</textarea><div class="acts"><button class="btn" data-a="savem">Save</button><button class="btn s" data-a="close">Cancel</button></div>`;

 else{const T=V.tab;

 {const m=$('main');if(m)m.scrollTop=scroll?m.scrollHeight:(st||0)}

 ({imp:pick,tab:()=>{V.tab=id;render()},open:()=>openChat(id),back:()=>{V.ctl?.abort();V.chat=null;V.edit=null;render()},
